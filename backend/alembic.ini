# Alembic: migrazioni dello schema SQLite. L'URL del database arriva da
# DATABASE_URL (vedi migrations/env.py), non da questo file.
#   alembic revision --autogenerate -m "descrizione"   # nuova migrazione
#   alembic upgrade head                              # applica (lo fa anche l'app all'avvio)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
