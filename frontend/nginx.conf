# nginx per StudyOS (immagine nginx-unprivileged: utente non root, porta 8080).
#
# Configurazione principale completa (sostituisce /etc/nginx/nginx.conf):
# - un solo worker: con `auto` nginx ne avvia uno per CPU visibile (12 sul
#   Mac di sviluppo) senza alcun beneficio per un'app personale;
# - serve la build Vite; le route della SPA ricadono su index.html, così il
#   refresh su /exams, /planner, ... funziona;
# - inoltra /api/* al backend (servizio `api` della rete Compose), togliendo
#   il prefisso: l'API resta interna e il browser parla con un'unica origine.
#   Il prefisso serve perché alcune route API (/exams, /goals, ...) hanno lo
#   stesso nome delle pagine della SPA.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log notice;

events {
    worker_connections 512;
}

http {
    # Il filesystem del container è in sola lettura: file temporanei in /tmp (tmpfs).
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        server_tokens off;

        # DNS interno di Docker, riletto spesso: se il backend viene ricreato e
        # cambia IP, nginx lo ritrova senza riavvio.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Il backend imposta il cookie di refresh con Path=/auth; visto dal
            # browser l'endpoint è /api/auth/..., quindi il Path va riscritto,
            # altrimenti il cookie non verrebbe mai rimandato al refresh.
            # Il cookie CSRF (Path=/) resta invariato.
            proxy_cookie_path /auth /api/auth;

            client_max_body_size 1m;
            proxy_read_timeout 30s;
        }

        # File con hash nel nome: cache lunga e immutabile.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location /fonts/ {
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / {
            # index.html sempre rivalidato: dopo un rebuild il browser carica i nuovi asset.
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files $uri $uri/ /index.html;
        }

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;
    }
}
